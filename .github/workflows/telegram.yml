name: Telegram Bot

on:
  schedule:
    - cron: '0 */2 * * *'

  workflow_dispatch:

jobs:
  run-bot:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Configurar Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.11"

      - name: Instalar dependências

        run: |
          pip install -r requirements.txt

      - name: Executar bot

        run: |
          python bot.py
